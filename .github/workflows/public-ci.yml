name: public-ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sha256sum --check CHECKSUMS.sha256

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: paper1_reflexive_intelligence.tex
